<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RevoShop Product Catalog</title>

  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-100 text-gray-900">

  <header class="bg-blue-700 text-white shadow-lg">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
      <div>
        <h1 class="text-2xl font-bold">
          RevoShop
        </h1>

        <p class="text-sm text-blue-100">
          TypeScript + Tailwind Product Catalog
        </p>
      </div>

      <div class="rounded-full bg-white px-4 py-2 font-semibold text-blue-700">
        Cart: <span id="cart-count">0</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-10">

    <section class="mb-8">
      <div class="mb-6">
        <h2 class="text-3xl font-bold text-gray-900">
          Product Catalog
        </h2>

        <p class="mt-2 text-gray-600">
          Search products and add available products to your cart.
        </p>
      </div>

      <div class="max-w-xl">
        <label
          for="search"
          class="mb-2 block text-sm font-semibold text-gray-700"
        >
          Search Product
        </label>

        <input
          id="search"
          type="search"
          placeholder="Search by product, category, or tag..."
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
        >
      </div>
    </section>

    <section>
      <div
        id="product-grid"
        class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      >
      </div>
    </section>

  </main>

  <script src="./dist/app.js"></script>
</body>
</html>
